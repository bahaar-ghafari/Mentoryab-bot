name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/bahaar-ghafari/mentoryab-bot

jobs:
  # ── 1. Install deps, typecheck, and run tests ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db

      - name: Type-check
        run: npm run build

      - name: Run tests
        run: npm test

  # ── 2. Build Docker image and push to GHCR ──────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

  # ── 2. Pull new image on VPS and restart ─────────────────────────────────────
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            # Pull latest repo changes including compose file
            git pull origin main

            # Image is public on GHCR — no login needed to pull
            docker compose -f docker-compose.prod.yml pull bot

            # Restart bot service only
            docker compose -f docker-compose.prod.yml up -d --no-deps bot

            # Cleanup old images
            docker image prune -f
